<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Meta description for SEO -->
    <meta name="description" content="Calculate your simple interest over time with our easy-to-use Simple Interest Rate Calculator.">
    <!-- Title for SEO -->
    <title>Interest Rate Calculator</title>
    <!-- Working favicon -->
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <!-- CSS referenced correctly -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="maindiv">
        <!-- H1 tag for SEO -->
        <h1>Interest Rate Calculator</h1>
        
        <label for="principal">Amount:</label>
        <input type="number" id="principal" name="principal" min="1">
        <br/><br/>
        
        <label for="rate">Interest Rate:</label>
        <input type="range" id="rate" name="rate" min="1" max="20" step="0.25" value="10.25" oninput="updateRate()">
        <span id="rate_val">10.25%</span>
        <br/><br/>
        
        <label for="years">No. of Years:</label>
        <select id="years" name="years">
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
            <option value="9">9</option>
            <option value="10">10</option>
        </select>
        <br/><br/>
        
        <button onclick="compute()">Compute Interest</button>
        <br/><br/>
        
        <span id="result"></span>
    </div>

    <!-- JavaScript referenced correctly -->
    <script src="script.js"></script>
</body>
</html>
